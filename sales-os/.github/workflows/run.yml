name: MUHIDE Sales OS — Automation

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run (leave empty for all)
        required: false
        type: choice
        options:
          - all
          - dedup_scanner
          - completeness_scorer
          - priority_assigner
          - stale_detector
          - sfda_sync_checker
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env from GitHub Secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: echo "NOTION_TOKEN=${NOTION_TOKEN}" > .env

      - name: Run selected script
        env:
          SCRIPT: ${{ inputs.script || 'all' }}
        run: |
          case "$SCRIPT" in
            all)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import dedup_scanner; import completeness_scorer; import priority_assigner; import stale_detector; import sfda_sync_checker; dedup_scanner.run(n); completeness_scorer.run(n); priority_assigner.run(n); stale_detector.run(n); sfda_sync_checker.run(n)"
              ;;
            dedup_scanner)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import dedup_scanner; dedup_scanner.run(n)"
              ;;
            completeness_scorer)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import completeness_scorer; completeness_scorer.run(n)"
              ;;
            priority_assigner)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import priority_assigner; priority_assigner.run(n)"
              ;;
            stale_detector)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import stale_detector; stale_detector.run(n)"
              ;;
            sfda_sync_checker)
              python -c "from config import NOTION_TOKEN; from notion_api import MuhideNotion; n = MuhideNotion(NOTION_TOKEN); import sfda_sync_checker; sfda_sync_checker.run(n)"
              ;;
            *)
              echo "::error::Invalid script selection: $SCRIPT"
              exit 1
              ;;
          esac
