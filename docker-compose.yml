# Canonical local/dev stack for SalesOS (AQLIYA) with observability.
# Secrets: prefer env vars / .env (see .env.example). Defaults are DEV-ONLY.
# Staging/prod: use salesos/docker-compose.yml or salesos/docker-compose.prod.yml.
#
# Profiles:
#   kafka          — optional Kafka + Zookeeper (EVENT_BUS_TYPE=kafka)
#   (default)      — core data + API + monitoring (Prometheus/Grafana/Loki/OTel)

services:
  # ── Data Layer ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesos}
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - salesos

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-salesos_neo4j_dev}
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4jdata:/data
    # HTTP probe avoids embedding passwords in healthcheck argv (compose subst issues).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - salesos

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - salesos

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-salesos_meili_master_key_dev}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - salesos

  # ── Optional Kafka (GA may run degraded with in_memory event bus) ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.2
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - salesos

  kafka:
    image: confluentinc/cp-kafka:7.7.2
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - salesos

  # ── Background Workers ──────────────────────────────────────
  worker:
    build:
      context: ./salesos/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-salesos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesos}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-salesos_neo4j_dev}
      SECRET_KEY: ${SECRET_KEY:-salesos-jwt-dev-key-change-in-production-32}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-salesos-jwt-dev-key-change-in-production-32}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_TYPE: ${EVENT_BUS_TYPE:-in_memory}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    command: >
      sh -c "celery -A app.celery_app worker --loglevel=info --concurrency=4 -E"
    networks:
      - salesos

  # ── API Service ─────────────────────────────────────────────
  api:
    build:
      context: ./salesos/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-salesos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesos}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-salesos_neo4j_dev}
      SECRET_KEY: ${SECRET_KEY:-salesos-jwt-dev-key-change-in-production-32}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-salesos-jwt-dev-key-change-in-production-32}
      SALESOS_TESTING: "false"
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_TYPE: ${EVENT_BUS_TYPE:-in_memory}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-salesos_meili_master_key_dev}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - salesos

  # ── Frontend (rebuild from source when routes 404 vs page.tsx) ──
  # Image lag is a common GA failure: source has routes, stale image returns 404.
  # Rebuild: docker compose build frontend && docker compose up -d frontend
  frontend:
    build:
      context: ./salesos/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BUILD_ID: ${GIT_SHA:-local}
    image: salesos-frontend:${IMAGE_TAG:-local}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    profiles: ["frontend"]
    networks:
      - salesos

  # ── Monitoring & Observability (canonical local stack) ──────
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./salesos/infra/monitoring/prometheus.compose-root.yml:/etc/prometheus/prometheus.yml:ro
      - ./salesos/infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - salesos

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-salesos_grafana_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./salesos/infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./salesos/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./salesos/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - salesos

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - salesos

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./salesos/infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - salesos

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-salesos}:${POSTGRES_PASSWORD:-salesos_dev_password}@postgres:5432/${POSTGRES_DB:-salesos}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - salesos

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - salesos

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./salesos/infra/monitoring/otel-collector-config.local.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    environment:
      ENVIRONMENT: ${ENV:-development}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      LOKI_ENDPOINT: http://loki:3100/loki/api/v1/push
    depends_on:
      - loki
    networks:
      - salesos

  promtail:
    image: grafana/promtail:3.1.1
    volumes:
      - ./salesos/infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
    networks:
      - salesos

volumes:
  pgdata:
  neo4jdata:
  redisdata:
  meilidata:
  promdata:
  grafanadata:

networks:
  salesos:
    driver: bridge
