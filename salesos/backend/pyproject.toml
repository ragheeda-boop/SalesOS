[tool.poetry]
name = "salesos-backend"
version = "5.1.0"
description = "SalesOS Enterprise Company Intelligence Platform - Backend"
authors = ["SalesOS Team"]

packages = [
    { include = "app" },
    { include = "sdk" },
    { include = "domains" },
    { include = "runtime" },
    { include = "modules" },
    { include = "intelligence" },
]

[tool.poetry.dependencies]
python = "^3.12"
# CI-22 / R-21 (DEC-054 / DEC-073 Phase 1): FastAPI >=0.136 + direct starlette>=1.3.1
# clears pip-audit starlette floor; pydantic floor raised to >=2.9 for FastAPI 0.14x.
fastapi = ">=0.136.0,<0.142.0"
starlette = ">=1.3.1,<2.0"
uvicorn = {extras = ["standard"], version = "^0.29"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
pydantic = ">=2.9,<3"
pydantic-settings = ">=2.2,<2.5"
python-jose = {extras = ["cryptography"], version = "^3.3"}
# Stage 5 pip-audit: cryptography 49.0.0 / CVE-2026-69247 — floor ≥50.0.0.
cryptography = ">=50.0.0"
passlib = {extras = ["bcrypt"], version = "^1.7"}
bcrypt = ">=4.0,<4.1"
# CI-16 / R-21: Poetry caret ^0.0.9 means >=0.0.9,<0.0.10; 0.0.27+ fixes multipart DoS advisories.
python-multipart = ">=0.0.27,<0.1.0"
openpyxl = "^3.1"
httpx = "^0.27"
aiokafka = ">=0.10,<0.15"
redis = "^5.0"
neo4j = "^5.20"
sentry-sdk = {extras = ["fastapi"], version = "^2.0"}
python-dotenv = "^1.0"
openai = "^1.30"
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"
opentelemetry-exporter-otlp-proto-http = "^1.25"
celery = "^5.4"
# CI-16 / R-21: ^0.243 pinned <0.244; pip-audit clear-all floor is 0.315.7
# (PYSEC-2026-133/134/1946/2282/2283/2284). Core package does not require
# FastAPI/starlette majors (extras only).
strawberry-graphql = ">=0.315.7,<1.0.0"
jsonschema = "^4.22"
# Required for pydantic EmailStr (identity/signup schemas). Was a FastAPI[standard]
# transitive under 0.111; not installed with bare fastapi>=0.136.
email-validator = ">=2.0,<3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
ruff = "^0.11"
mypy = "^1.10"
asyncpg-stubs = "^0.29"
pytest-xdist = "^3.6"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PL", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Framework-convention parameters: FastAPI dependency-injection signatures,
# GraphQL resolvers, Celery task bindings, and test doubles must conform to
# framework/protocol signatures even when an argument is unused.
"app/routers/*.py" = ["B008", "ARG001"]
"app/modules/*/router.py" = ["B008", "ARG001"]
"app/modules/*/routers/*.py" = ["B008", "ARG001"]
"app/modules/identity/*_router.py" = ["B008", "ARG001"]
"app/modules/billing/stripe_router.py" = ["B008", "ARG001"]
"app/modules/billing/usage_meter_router.py" = ["B008", "ARG001"]
"app/modules/billing/dunning_router.py" = ["B008", "ARG001"]
"app/modules/billing/proration_router.py" = ["B008", "ARG001"]
"app/modules/admin/ai_model_tiers_router.py" = ["B008", "ARG001"]
"app/modules/sso/saml_router.py" = ["B008", "ARG001", "N803"]
"app/main.py" = ["B008"]
"app/dependencies.py" = ["B008"]
"app/owner_auth.py" = ["B008"]
"app/application/dashboard/router.py" = ["B008"]
"app/application/admin/data_quality.py" = ["B008"]
"app/graphql/*.py" = ["ARG001"]
"app/boot/startup.py" = ["ARG001"]
"app/tasks.py" = ["ARG001"]
"app/railway_celery_service.py" = ["ARG001", "ARG002"]
"app/modules/communication_hub/tasks.py" = ["ARG001"]
"app/modules/rules_engine/engine.py" = ["ARG001"]
# Pydantic DTOs / API schemas mirror camelCase external JSON keys.
"app/application/dashboard/dto/*.py" = ["N815"]
"app/modules/company/intelligence_dto.py" = ["N815"]
"app/modules/decision/schemas.py" = ["N815"]
"app/modules/company/search_repository.py" = ["N806"]
"app/modules/contact/search_repository.py" = ["N806"]
"app/modules/identity/service.py" = ["N806"]
"app/modules/sso/saml_service.py" = ["N817", "ARG002"]
# Module-level env/bootstrap setup must precede imports.
"app/database.py" = ["E402"]
"app/modules/admin/router.py" = ["E402"]
"tests/e2e/conftest.py" = ["E402"]
"tests/unit/conftest.py" = ["E402"]
"tests/unit/test_admin_api.py" = ["E402"]
"tests/unit/test_mcp_server.py" = ["E402"]
# Interface-conformance parameters in internal services/repositories.
"app/modules/webhooks/url_safety.py" = ["ARG002"]
"app/modules/communication_hub/calendar_sync.py" = ["ARG002"]
"app/modules/company/pgvector_repository.py" = ["ARG002"]
"app/modules/company/repositories.py" = ["ARG002"]
"app/modules/company/service.py" = ["ARG002"]
"app/modules/decision/engine.py" = ["ARG002"]
"app/modules/employee_360/service.py" = ["ARG002"]
"app/modules/excel_import/service.py" = ["ARG002"]
"sdk/events/outbox.py" = ["ARG002"]
"sdk/graph.py" = ["ARG002"]
# Test doubles must match mocked signatures.
"app/**/tests/*.py" = ["ARG001", "ARG002"]
"tests/**/*.py" = ["ARG001", "ARG002"]
"tests/unit/test_nba_pipeline.py" = ["N807"]
"tests/support/tenant_isolation.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["app/", "sdk/", "modules/", "cli/", "domains/"]
exclude = ["app/alembic/versions/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring a live database and full application stack",
    "contract: OpenAPI / HTTP schema conformance tests (TEST_STRATEGY.md §3)",
]
testpaths = [
    "tests",
    "app/modules/identity/tests",
    "app/modules/company/tests",
    "app/modules/entity_resolution/tests",
    "app/modules/excel_import/tests",
    "app/modules/notion_sync/tests",
    "domains/search/tests",
    "domains/decision_center/tests",
    "domains/commercial/activity/tests",
    "domains/commercial/contract/tests",
    "domains/commercial/opportunity/tests",
    "domains/commercial/pipeline/tests",
    "domains/commercial/proposal/tests",
    "domains/commercial/quote/tests",
    "domains/decision/context/tests",
    "domains/decision/recommendation/tests",
    "domains/revenue/analytics/tests",
    "domains/revenue/forecast/tests",
    "domains/timeline/tests",
    "domains/workflow/tests",
    "runtime/data_fabric_runtime/tests",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app", "domains", "sdk", "runtime", "intelligence"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

# ── Per-Domain Coverage Minimums (enforced by scripts/check-coverage.ps1) ──
# Identity: 88%  |  Company: 80%  |  Search: 93%   |  Timeline: 82%
# CRM: 80%       |  Scoring: 78%  |  AI: 92%       |  Workflow: 95%

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
