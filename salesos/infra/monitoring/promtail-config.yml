server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: salesos-backend
    static_configs:
      - targets: ["localhost"]
        labels:
          job: salesos-backend
          service: salesos-api
          __path__: /var/log/salesos/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            logger: logger
            request_id: request_id
            tenant_id: tenant_id
            latency_ms: latency_ms
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: salesos-backend-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            logger: logger
            request_id: request_id
            tenant_id: tenant_id
            latency_ms: latency_ms
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
