apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: salesos
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: salesos
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: salesos
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: salesos
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: "SalesOS"
        orgId: 1
        folder: "SalesOS"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/salesos
  salesos-overview.json: |
    {"__inputs":[],"__requires":[],"title":"SalesOS Overview","uid":"salesos-overview","version":1,"timezone":"browser","editable":true,"panels":[{"title":"HTTP Request Rate","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"rate(salesos_http_requests_total[1m])","legendFormat":"{{method}} {{path}}"}],"fieldConfig":{"defaults":{"unit":"reqps","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}},"description":"HTTP requests per second"},{"title":"P50 / P95 / P99 Latency","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"histogram_quantile(0.50, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P50"},{"expr":"histogram_quantile(0.95, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P95"},{"expr":"histogram_quantile(0.99, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P99"}],"fieldConfig":{"defaults":{"unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}},"description":"HTTP latency percentiles"},{"title":"Error Rate","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"rate(salesos_http_requests_total{status=~\"5..\"}[5m]) / rate(salesos_http_requests_total[5m]) * 100","legendFormat":"error rate"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"orange","value":5},{"color":"red","value":10}]},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":20}}},"description":"5xx error rate"},{"title":"DB Query Duration (P95)","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":8},"targets":[{"expr":"histogram_quantile(0.95, rate(salesos_db_query_duration_seconds_bucket[5m]))","legendFormat":"{{query_name}}"}],"fieldConfig":{"defaults":{"unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}},"description":"P95 DB query duration"},{"title":"AI Inference Duration (P95)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":16},"targets":[{"expr":"histogram_quantile(0.95, rate(salesos_ai_inference_duration_seconds_bucket[5m]))","legendFormat":"{{model}}"}],"fieldConfig":{"defaults":{"unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Active Alerts","type":"alertlist","gridPos":{"h":10,"w":12,"x":0,"y":28},"targets":[],"description":"Currently firing alerts"}],"schemaVersion":35,"refresh":"15s","tags":["salesos","monitoring","overview"]}
  salesos-api-metrics.json: |
    {"__inputs":[],"__requires":[],"title":"SalesOS API Metrics","uid":"salesos-api-metrics","version":1,"timezone":"browser","editable":true,"panels":[{"title":"Request Throughput","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"rate(salesos_http_requests_total[1m])","legendFormat":"{{method}} {{path}}"}],"fieldConfig":{"defaults":{"unit":"reqps","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Latency Percentiles","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"histogram_quantile(0.50, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P50"},{"expr":"histogram_quantile(0.95, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P95"},{"expr":"histogram_quantile(0.99, rate(salesos_http_request_duration_seconds_bucket[5m]))","legendFormat":"P99"}],"fieldConfig":{"defaults":{"unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Error Rate (%)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"rate(salesos_http_requests_total{status=~\"5..\"}[5m]) / rate(salesos_http_requests_total[5m]) * 100","legendFormat":"5xx"},{"expr":"rate(salesos_http_requests_total{status=~\"4..\"}[5m]) / rate(salesos_http_requests_total[5m]) * 100","legendFormat":"4xx"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"orange","value":5},{"color":"red","value":10}]},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":20}}}},{"title":"Request Volume (Top 10)","type":"bargauge","gridPos":{"h":8,"w":24,"x":0,"y":24},"targets":[{"expr":"topk(10, sum by (method, path) (increase(salesos_http_requests_total[1h])))","legendFormat":"{{method}} {{path}}"}],"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"unit":"short"}}}],"schemaVersion":35,"refresh":"15s","tags":["salesos","api","sla"]}
  salesos-db.json: |
    {"__inputs":[],"__requires":[],"title":"SalesOS Database","uid":"salesos-db","version":1,"timezone":"browser","editable":true,"panels":[{"title":"DB Connections","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"pg_stat_database_numbackends","legendFormat":"connections"}],"fieldConfig":{"defaults":{"unit":"short","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Pool Utilization","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"salesos_db_pool_checkedout / (salesos_db_pool_checkedout + salesos_db_pool_checkedin + 0.001) * 100","legendFormat":"pool %"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"orange","value":70},{"color":"red","value":90}]},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":20}}}},{"title":"Query Duration (P50/P95/P99)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"histogram_quantile(0.50, rate(salesos_db_query_duration_seconds_bucket[5m]))","legendFormat":"P50"},{"expr":"histogram_quantile(0.95, rate(salesos_db_query_duration_seconds_bucket[5m]))","legendFormat":"P95"},{"expr":"histogram_quantile(0.99, rate(salesos_db_query_duration_seconds_bucket[5m]))","legendFormat":"P99"}],"fieldConfig":{"defaults":{"unit":"s","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Cache Hit Ratio","type":"gauge","gridPos":{"h":4,"w":4,"x":4,"y":16},"targets":[{"expr":"rate(pg_stat_database_blks_hit[5m]) / (rate(pg_stat_database_blks_hit[5m]) + rate(pg_stat_database_blks_read[5m]) + 0.001) * 100","legendFormat":"hit %"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"red","value":0},{"color":"orange","value":90},{"color":"green","value":99}]}}}}],"schemaVersion":35,"refresh":"15s","tags":["salesos","database","postgres"]}
  salesos-business.json: |
    {"__inputs":[],"__requires":[],"title":"SalesOS Business Metrics","uid":"salesos-business","version":1,"timezone":"browser","editable":true,"panels":[{"title":"Records Ingested","type":"stat","gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"expr":"salesos_pipeline_records_ingested_total","legendFormat":"total"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green"}]}}}},{"title":"Golden Records","type":"stat","gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"expr":"salesos_golden_records_total","legendFormat":"golden"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"purple"}]}}}},{"title":"Pipeline Error Rate","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"rate(salesos_pipeline_errors_total[5m])","legendFormat":"{{stage}}"}],"fieldConfig":{"defaults":{"unit":"cps","color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","fillOpacity":10}}}},{"title":"Stage Duration","type":"barchart","gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"expr":"salesos_pipeline_stage_duration_ms_avg","legendFormat":"{{stage}}"}],"fieldConfig":{"defaults":{"unit":"ms","color":{"mode":"palette-classic"}}}}],"schemaVersion":35,"refresh":"15s","tags":["salesos","business","pipeline"]}
  salesos-pipeline.json: |
    {"__inputs":[],"__requires":[],"title":"SalesOS Pipeline","uid":"salesos-pipeline","version":1,"timezone":"browser","editable":true,"panels":[{"title":"DLQ Failed","type":"stat","gridPos":{"h":4,"w":4,"x":0,"y":4},"targets":[{"expr":"salesos_dlq_failed_total","legendFormat":"failed"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"red","value":1}]}}}}],"schemaVersion":35,"refresh":"15s","tags":["salesos","pipeline"]}
