apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: salesos
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: salesos
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: salesos
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: salesos
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
  clusterIP: None
