apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: salesos
  labels:
    app: celery-worker
    component: background-jobs
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      serviceAccountName: salesos-backend
      containers:
        - name: worker
          image: ghcr.io/ragheeda-boop/salesos/backend:latest
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --max-tasks-per-child=1000
          envFrom:
            - configMapRef:
                name: salesos-config
            - secretRef:
                name: salesos-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.celery_app
                - inspect
                - ping
                - -d
                - celery@$(hostname)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: salesos
  labels:
    app: celery-beat
    component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      serviceAccountName: salesos-backend
      containers:
        - name: beat
          image: ghcr.io/ragheeda-boop/salesos/backend:latest
          command:
            - celery
            - -A
            - app.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: salesos-config
            - secretRef:
                name: salesos-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      restartPolicy: Always
