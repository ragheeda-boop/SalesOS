apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  namespace: salesos
  labels:
    app: db-migrations
    component: database
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: salesos-backend
      containers:
        - name: migrate
          image: ghcr.io/ragheeda-boop/salesos/backend:latest
          command:
            - sh
            - -c
            - |
              echo "Running alembic migrations..."
              alembic upgrade head
              echo "Migrations complete."
          envFrom:
            - configMapRef:
                name: salesos-config
            - secretRef:
                name: salesos-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
