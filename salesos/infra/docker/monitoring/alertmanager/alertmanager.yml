route:
  group_by: ["alertname", "severity", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
      continue: true
    - match:
        severity: warning
      receiver: "warnings"
      repeat_interval: 4h
    - match:
        alertname: "HighErrorRate|BackendDown|PostgresDown|Neo4jDown|RedisDown"
      receiver: "critical"
      repeat_interval: 30m

receivers:
  - name: "default"
    slack_configs:
      - send_resolved: true
        api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#salesos-alerts"
        username: "Alertmanager"
        icon_emoji: ":warning:"
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Instance:* {{ .Labels.instance }}
            *Graph:* <{{ .GeneratorURL }}|View in Prometheus>
            *Started:* {{ .StartsAt }}
          {{ end }}
        footer: "SalesOS Production Monitoring"
        fallback: "{{ .CommonAnnotations.summary }}"

  - name: "critical"
    slack_configs:
      - send_resolved: true
        api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#salesos-critical"
        username: "Alertmanager"
        icon_emoji: ":red_circle:"
        title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [CRITICAL] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Instance:* {{ .Labels.instance }}
            *Graph:* <{{ .GeneratorURL }}|View in Prometheus>
            *Started:* {{ .StartsAt }}
          {{ end }}
        footer: "SalesOS Critical Incident Response"
        fallback: "[CRITICAL] {{ .CommonAnnotations.summary }}"
    email_configs:
      - send_resolved: true
        to: "${ALERTMANAGER_EMAIL_TO}"
        from: "${ALERTMANAGER_EMAIL_FROM}"
        smarthost: "${ALERTMANAGER_SMTP_HOST}:${ALERTMANAGER_SMTP_PORT}"
        auth_username: "${ALERTMANAGER_SMTP_USER}"
        auth_password: "${ALERTMANAGER_SMTP_PASSWORD}"
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .Status }}'
        html: '<h2>{{ .GroupLabels.alertname }}</h2><p>{{ range .Alerts }}{{ .Annotations.description }}<br>{{ end }}</p>'
    pagerduty_configs:
      - send_resolved: true
        routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical
        description: '{{ .GroupLabels.alertname }} - {{ .CommonAnnotations.summary }}'
        client: "SalesOS Production"
        client_url: "https://monitoring.salesos.com"

  - name: "warnings"
    slack_configs:
      - send_resolved: true
        api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#salesos-alerts"
        username: "Alertmanager"
        icon_emoji: ":warning:"
        title: '{{ if eq .Status "firing" }}⚠️{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
        footer: "SalesOS Monitoring"
        fallback: "{{ .CommonAnnotations.summary }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "namespace"]
