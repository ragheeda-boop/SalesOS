name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  # Per-SHA group: with cancel-in-progress false on a ref-wide group, rapid
  # master pushes still cancel *pending* runs (GHA keeps one pending per group).
  # SHA isolation lets tip Stages 1–5 finish for criterion 3.9 under swarm docs.
  # Stage 7 evidence: e2e-stage7.yml (not this workflow).
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ragheeda-boop/salesos

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Lint & Format
  # ──────────────────────────────────────────────
  lint-backend:
    name: "Stage 1: Backend Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Ruff lint
        run: cd salesos/backend && poetry run ruff check app/ tests/ sdk/ modules/ --output-format=github
      - name: Ruff format check
        run: cd salesos/backend && poetry run ruff format --check app/ tests/ sdk/ modules/

  lint-frontend:
    name: "Stage 1: Frontend Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install dependencies
        run: cd salesos/frontend && npm ci --no-audit --no-fund
      - name: ESLint
        run: cd salesos/frontend && npm run lint
      - name: Prettier check
        run: cd salesos/frontend && npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"

  # ──────────────────────────────────────────────
  # Stage 2: Type Check
  # ──────────────────────────────────────────────
  typecheck-backend:
    name: "Stage 2: Backend Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: MyPy type check
        run: cd salesos/backend && poetry run mypy app/ sdk/ modules/ --no-error-summary

  typecheck-frontend:
    name: "Stage 2: Frontend Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install dependencies
        run: cd salesos/frontend && npm ci --no-audit --no-fund
      - name: TypeScript check
        run: cd salesos/frontend && npx tsc --noEmit

  # ──────────────────────────────────────────────
  # Stage 3: Unit Tests
  # ──────────────────────────────────────────────
  test-backend:
    name: "Stage 3: Backend Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint-backend, typecheck-backend]
    env:
      # CI-only placeholders (>=32 chars). Required by Settings when alembic/env imports app.config.
      SECRET_KEY: ci-unit-test-secret-key-do-not-use-in-prod
      JWT_SECRET_KEY: ci-unit-test-jwt-secret-do-not-use-in-prod
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: salesos
          POSTGRES_PASSWORD: salesos_test
          POSTGRES_DB: salesos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # STORY-03-03: full history, not the default shallow fetch-depth:1
          # — the diff-coverage gate below needs the merge-base with the PR's
          # base branch, which a shallow clone doesn't carry.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Run migrations
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          poetry run alembic upgrade head
      - name: Migrate gate (current == heads)
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          poetry run python scripts/check_alembic_head.py
      - name: Provision salesos_app role (R-14)
        # docs/program/RISK_REGISTER.md R-14: mirrors the local-dev/staging/prod
        # least-privilege runtime role in CI's ephemeral Postgres service. The
        # `services:` container can't bind-mount infra/docker/postgres/init
        # (it starts before checkout), so this runs the same idempotent SQL
        # explicitly, after migrations have created the schemas it grants on.
        run: |
          cd salesos
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/02-app-role.sql
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE salesos_app WITH PASSWORD 'ci_app_role_test_password';"
      - name: Run unit tests with coverage gate
        run: |
          cd salesos/backend
          # Host/port/db must match the GHA postgres service. APP_POSTGRES_PASSWORD
          # alone rewrites app_database_url onto settings.postgres_host (default
          # "postgres:6432") which DNS-fails on the runner (adversarial RLS +
          # get_db isolation → socket.gaierror). Do not weaken RLS — fix the URL.
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          TEST_DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          POSTGRES_HOST=localhost \
          POSTGRES_PORT=5432 \
          POSTGRES_DB=salesos_test \
          POSTGRES_PASSWORD=salesos_test \
          APP_POSTGRES_USER=salesos_app \
          APP_POSTGRES_PASSWORD=ci_app_role_test_password \
          poetry run pytest -v \
            --cov=app --cov=domains --cov=sdk --cov=runtime --cov=intelligence \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=55 \
            -m "not e2e"
      - name: Diff coverage gate (new/changed lines only)
        # STORY-03-03 (Sprint 02): independent of --cov-fail-under=85 above,
        # which is repo-wide and grandfathers existing Grade D coverage (see
        # CANONICAL_ARCHITECTURE.md §17) — this one only looks at lines this
        # PR actually added or changed, per docs/program/TEST_STRATEGY.md §0.
        # PR-only: a push directly to main/develop has no meaningful base to
        # diff against.
        if: github.event_name == 'pull_request'
        run: |
          cd salesos/backend
          poetry run python scripts/check_diff_coverage.py \
            --coverage-xml coverage.xml \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --fail-under 80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            salesos/backend/coverage.xml
            salesos/backend/htmlcov/

  test-frontend:
    name: "Stage 3: Frontend Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install dependencies
        run: cd salesos/frontend && npm ci --no-audit --no-fund
      - name: Run tests
        run: cd salesos/frontend && npm run test -- --coverage --forceExit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: salesos/frontend/coverage/

  # ──────────────────────────────────────────────
  # Stage 4: Integration Tests
  # ──────────────────────────────────────────────
  integration-backend:
    name: "Stage 4: Integration Tests"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    env:
      # CI-only placeholders (>=32 chars). Required by Settings when alembic/env imports app.config.
      SECRET_KEY: ci-unit-test-secret-key-do-not-use-in-prod
      JWT_SECRET_KEY: ci-unit-test-jwt-secret-do-not-use-in-prod
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: salesos
          POSTGRES_PASSWORD: salesos_test
          POSTGRES_DB: salesos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Run migrations
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          poetry run alembic upgrade head
      - name: Provision salesos_app role (R-14)
        # docs/program/RISK_REGISTER.md R-14 — see test-backend job above for
        # why this is an explicit step rather than a docker-entrypoint-initdb.d
        # mount.
        run: |
          cd salesos
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/02-app-role.sql
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE salesos_app WITH PASSWORD 'ci_app_role_test_password';"
      - name: Run integration tests
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          TEST_DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          POSTGRES_HOST=localhost \
          POSTGRES_PORT=5432 \
          POSTGRES_DB=salesos_test \
          POSTGRES_PASSWORD=salesos_test \
          REDIS_URL=redis://localhost:6379/0 \
          APP_POSTGRES_USER=salesos_app \
          APP_POSTGRES_PASSWORD=ci_app_role_test_password \
          poetry run pytest -v \
            --cov=app --cov=domains \
            --cov-report=term-missing \
            --cov-report=xml:integration-coverage.xml \
            -m "not e2e" \
            -n auto
      - name: Upload integration coverage
        # Coverage upload must not fail Stage 4 when pytest already passed.
        # Observed flake: FinalizeArtifact 404 after successful blob upload
        # (run 30759755215 / tip 3a25c76) — infra flake, not test failure.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-coverage-${{ github.run_id }}
          path: salesos/backend/integration-coverage.xml
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Stage 5: Security Scan
  # ──────────────────────────────────────────────
  security-pip-audit:
    name: "Stage 5: pip-audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: |
          pipx install poetry
          poetry self add poetry-plugin-export
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          cd salesos/backend
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          # DEC-057 Option A + DEC-090: named ignore for ecdsa Minerva (PYSEC-2026-1325) only.
          # JWT paths are RS256/HS256 (no ES*); upstream has no planned fix. --strict retained.
          pip-audit -r /tmp/requirements.txt --desc on --ignore-vuln PYSEC-2026-1325 -f json -o pip-audit-report.json || true
          pip-audit -r /tmp/requirements.txt --desc on --ignore-vuln PYSEC-2026-1325 --strict
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-report
          path: salesos/backend/pip-audit-report.json

  security-npm-audit:
    name: "Stage 5: npm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install dependencies
        run: cd salesos/frontend && npm ci --no-audit --no-fund
      - name: Run npm audit
        run: |
          cd salesos/frontend
          npm audit --audit-level=high --json > npm-audit-report.json || true
          npm audit --audit-level=high

  security-bandit:
    name: "Stage 5: Bandit SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install "bandit[toml,sarif]"
      - name: Run bandit
        run: |
          cd salesos/backend
          bandit -r app/ domains/ sdk/ modules/ \
            -f sarif -o bandit-results.sarif \
            --severity-level medium --confidence-level medium \
            -x app/tests,domains/*/tests || true
      - name: Upload bandit results
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: salesos/backend/bandit-results.sarif
      - name: Run bandit (fail on high)
        run: |
          cd salesos/backend
          bandit -r app/ domains/ sdk/ modules/ \
            -f json -o bandit-report.json \
            --severity-level high --confidence-level high \
            -x app/tests,domains/*/tests || exit_code=$?
          if [ "${exit_code:-0}" -gt 0 ]; then
            echo "::error::Bandit found high-severity security issues"
            exit 1
          fi

  security-secrets-scan:
    name: "Stage 5: Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check for forbidden files
        run: |
          forbidden=0
          for pattern in '*.env' '*.key' '*.pem' 'secrets.*' 'credentials*' '*.p12' '*.pfx' '*.jks'; do
            files=$(git ls-files -- "$pattern" 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "::error::Forbidden pattern '$pattern' found: $files"
              forbidden=1
            fi
          done
          if [ "$forbidden" = "1" ]; then
            echo "Forbidden files detected — these must not be committed."
            exit 1
          fi
          echo "No forbidden files detected."
      - name: Run Trivy filesystem scan (blocking gate, visible findings)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          # DEC-098: named ignore CVE-2024-23342 only (DEC-057/090 ecdsa residual). No blanket ignore.
          trivyignores: .trivyignore
      - name: Export Trivy SARIF for code scanning
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          trivyignores: .trivyignore
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-results.sarif

  # DEC-144 / Phase 0 criterion 8.3: backend architecture fitness rules as an
  # independent critical gate (does not depend on lint/unit — those can skip
  # and still leave layering unenforced). Narrow pytest path only.
  test-architecture:
    name: "Stage 5: Architecture Rules"
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-unit-test-secret-key-do-not-use-in-prod
      JWT_SECRET_KEY: ci-unit-test-jwt-secret-do-not-use-in-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Run architecture fitness tests
        run: |
          cd salesos/backend
          poetry run pytest -v --tb=short tests/test_architecture.py

  arch-compliance:
    name: "Stage 5: Arch Compliance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run architecture compliance check
        shell: pwsh
        run: |
          $result = & "${{ github.workspace }}/salesos/scripts/arch-compliance.ps1" -JsonOnly
          $report = $result | ConvertFrom-Json
          Write-Host "Overall Compliance: $($report.overall_compliance)%"
          Write-Host "Target: $($report.summary.target_compliance)%"
          if ($report.overall_compliance -lt $report.summary.target_compliance) {
            Write-Host "::error::Architecture compliance $($report.overall_compliance)% is below target $($report.summary.target_compliance)%"
            exit 1
          }
          Write-Host "::notice::Architecture compliance $($report.overall_compliance)% meets target"
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-compliance-report
          path: salesos/reports/arch-compliance-report.json

  # ──────────────────────────────────────────────
  # Stage 6: Build + GHCR Push — QUARANTINED (DEC-150 Option B)
  # GHCR publish is no longer a required Phase 0 capability after DEC-149
  # (canonical deploy = Railway BE + Vercel FE). Jobs kept for historical /
  # emergency reference only; forced inactive via `if: false` (same pattern
  # family as K8s deploy-production.yml quarantine). Do not remove Stages 1–5.
  # To re-enable: ARB must reverse DEC-150 B and restore Phase 0 GHCR AC.
  # ──────────────────────────────────────────────
  build-backend:
    name: "Stage 6: Build Backend (QUARANTINED DEC-150 B)"
    if: false
    needs:
      - test-backend
      - test-frontend
      - integration-backend
      - security-pip-audit
      - security-npm-audit
      - security-bandit
      - security-secrets-scan
      - test-architecture
      - arch-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Docker layer caching
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: docker-backend-${{ runner.os }}-${{ hashFiles('salesos/backend/Dockerfile') }}
          restore-keys: docker-backend-${{ runner.os }}-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./salesos/backend
          file: ./salesos/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

  build-frontend:
    name: "Stage 6: Build Frontend (QUARANTINED DEC-150 B)"
    if: false
    needs:
      - test-backend
      - test-frontend
      - integration-backend
      - security-pip-audit
      - security-npm-audit
      - security-bandit
      - security-secrets-scan
      - test-architecture
      - arch-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Docker layer caching
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: docker-frontend-${{ runner.os }}-${{ hashFiles('salesos/frontend/Dockerfile') }}
          restore-keys: docker-frontend-${{ runner.os }}-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./salesos/frontend
          file: ./salesos/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

  # ──────────────────────────────────────────────
  # Stage 7: E2E Tests — MOVED to .github/workflows/e2e-stage7.yml
  # Criterion 3.7 evidence path is the standalone workflow (own concurrency,
  # cancel-in-progress: false). Keep this job skipped so docs pushes cannot
  # cancel Stages 1–5 via a long E2E job on the same ci.yml group.
  # Stage 6 stays quarantined (DEC-150 B). Do not un-quarantine GHCR.
  # ──────────────────────────────────────────────
  e2e:
    name: "Stage 7: E2E Tests (see e2e-stage7.yml)"
    if: false
    needs:
      - test-backend
      - test-frontend
      - integration-backend
      - security-pip-audit
      - security-npm-audit
      - security-bandit
      - security-secrets-scan
      - test-architecture
      - arch-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # CI-only placeholders (>=32 chars). Required by Settings / JWKS.
      SECRET_KEY: ci-e2e-test-secret-key-do-not-use-in-prod!!
      JWT_SECRET_KEY: ci-e2e-test-jwt-secret-do-not-use-in-prod
      E2E_USER_EMAIL: e2e.ci+stage7@example.com
      E2E_USER_PASSWORD: E2eCiPassw0rd!
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
      BASE_URL: http://localhost:3000
      SALESOS_JWKS_ALLOW_REGENERATE: "1"
      EVENT_BUS_TYPE: in_memory
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: salesos
          POSTGRES_PASSWORD: salesos_test
          POSTGRES_DB: salesos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-e2e-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-e2e-${{ runner.os }}-
      - name: Install backend dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run migrations
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          poetry run alembic upgrade head
      - name: Provision salesos_app role (R-14)
        run: |
          cd salesos
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/02-app-role.sql
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE salesos_app WITH PASSWORD 'ci_app_role_test_password';"
      - name: Start backend API
        run: |
          cd salesos/backend
          # Owner role for disposable register (salesos_app RLS hung ~120s→422
          # on tip 8600f68). Real postgres/redis retained for 3.7. DEC-085 untouched.
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          TEST_DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          POSTGRES_USER=salesos \
          POSTGRES_HOST=localhost \
          POSTGRES_PORT=5432 \
          POSTGRES_DB=salesos_test \
          POSTGRES_PASSWORD=salesos_test \
          REDIS_URL=redis://localhost:6379/0 \
          ALLOWED_HOSTS=http://localhost:3000,http://127.0.0.1:3000 \
          NEO4J_PASSWORD= \
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/salesos-e2e-backend.log 2>&1 &
          echo $! > /tmp/salesos-e2e-backend.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health/live >/dev/null 2>&1; then
              echo "backend live after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"
          tail -n 200 /tmp/salesos-e2e-backend.log || true
          exit 1
      - name: Register disposable E2E user
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "email": os.environ["E2E_USER_EMAIL"],
              "password": os.environ["E2E_USER_PASSWORD"],
              "full_name": "CI E2E User",
          }
          open("/tmp/e2e-register-body.json", "w", encoding="utf-8").write(json.dumps(payload))
          PY
          code=$(curl -sS --max-time 60 -o /tmp/e2e-register.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8000/api/v1/identity/register \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/e2e-register-body.json)
          echo "register HTTP ${code}"
          cat /tmp/e2e-register.json || true
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::E2E user register failed (HTTP ${code})"
            tail -n 200 /tmp/salesos-e2e-backend.log || true
            exit 1
          fi
      - name: Install Playwright
        run: |
          cd salesos/frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Setup .env for E2E
        run: |
          printf '%s\n' 'NEXT_PUBLIC_API_URL=http://localhost:8000' 'API_URL=http://localhost:8000' \
            > salesos/frontend/.env.local
      - name: Run E2E tests (smoke + real BE)
        # Gate = Wave 13 authenticated smoke against real postgres/redis/API.
        # Excludes visual baselines (no chromium-linux snapshots) and numbered
        # 01–27 suite (getByLabel / RTL / data debt — residual for 3.7 CONDITIONAL).
        run: |
          cd salesos/frontend
          npx playwright test --config playwright.config.ts --project=chromium \
            e2e/smoke-auth-ui.spec.ts
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-backend-log
          path: /tmp/salesos-e2e-backend.log
          retention-days: 7
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: |
            salesos/frontend/test-results/
            salesos/frontend/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # CI Summary
  # ──────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    if: always()
    needs:
      - lint-backend
      - lint-frontend
      - typecheck-backend
      - typecheck-frontend
      - test-backend
      - test-frontend
      - integration-backend
      - security-pip-audit
      - security-npm-audit
      - security-bandit
      - security-secrets-scan
      - test-architecture
      - arch-compliance
      - build-backend
      - build-frontend
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Lint | lint-backend | ${{ needs.lint-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Lint | lint-frontend | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 Types | typecheck-backend | ${{ needs.typecheck-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 Types | typecheck-frontend | ${{ needs.typecheck-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 Unit Tests | test-backend | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 Unit Tests | test-frontend | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 Integration | integration-backend | ${{ needs.integration-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Security | pip-audit | ${{ needs.security-pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Security | npm-audit | ${{ needs.security-npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Security | bandit | ${{ needs.security-bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Security | secrets-scan | ${{ needs.security-secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Arch | test-architecture | ${{ needs.test-architecture.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Arch | arch-compliance | ${{ needs.arch-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 Build | build-backend | ${{ needs.build-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 Build | build-frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 E2E | e2e | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
      - name: Fail if any critical job failed
        if: |
          needs.lint-backend.result == 'failure' ||
          needs.typecheck-backend.result == 'failure' ||
          needs.test-backend.result == 'failure' ||
          needs.integration-backend.result == 'failure' ||
          needs.security-secrets-scan.result == 'failure' ||
          needs.test-architecture.result == 'failure' ||
          needs.arch-compliance.result == 'failure'
        run: |
          echo "::error::One or more critical CI jobs failed"
          exit 1
