# Deploy Staging — DEC-149 / OPS-01 Row 4 (staging provisioned 2026-08-06)
# Staging Railway env + RAILWAY_STAGING_* secrets present (SERVICE 668122aa-...,
# ENV 5ce7864a-27c5-43c7-847d-667aecfbf773 — CLI-authoritative for
# responsible-comfort). Manual dispatch only (no auto-run on push — avoids
# dual-fire with deploy.yml on master). Raises when staging secrets absent.
# Prefer --environment staging (name). Do not substitute unverified UUIDs.
# Frontend → Vercel (Git primary; optional CLI). No GHCR/SSH.
# CI Stage 6 GHCR publish (ci.yml) quarantined under DEC-150 Option B — not Phase 0 required.

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type CONFIRM-STAGING-DEPLOY (staging deferred until Railway staging exists — DEC-149 single-env)"
        required: true
        type: string
      skip_backend:
        description: "Skip Railway staging backend deploy"
        required: false
        type: boolean
        default: false
      skip_frontend_cli:
        description: "Skip optional Vercel CLI"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SMOKE_RETRIES: 12
  SMOKE_WAIT: 15

permissions:
  contents: read

jobs:
  staging-gate:
    name: Staging Availability Gate (DEC-149 single-env)
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      staging_ready: ${{ steps.probe.outputs.staging_ready }}
      short_tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require explicit confirmation
        env:
          ACK: ${{ inputs.confirm_staging }}
        run: |
          if [ "${ACK}" != "CONFIRM-STAGING-DEPLOY" ]; then
            echo "::error::Staging deploy requires explicit confirmation."
            echo "To run, set confirm_staging=CONFIRM-STAGING-DEPLOY."
            exit 1
          fi
      - id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying: $SHORT"
      - name: Probe Railway staging secrets (fail if absent — staging is provisioned)
        id: probe
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          missing=""
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_STAGING_SERVICE_ID RAILWAY_STAGING_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Staging Railway secrets missing:${missing}"
            echo "Set RAILWAY_STAGING_SERVICE_ID / RAILWAY_STAGING_ENVIRONMENT_ID in repo secrets (OPS-01 Row 4)."
            echo "staging_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "staging_ready=true" >> "$GITHUB_OUTPUT"
          echo "Staging Railway secrets present — proceed with deploy."

  schema-drift-gate:
    name: Schema Drift Gate (local — verify single alembic head)
    needs: staging-gate
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install backend dependencies (needed to import alembic locally)
        run: cd salesos/backend && poetry install --no-interaction
      - name: Check alembic chain (local-only — single head required)
        # --local-only: no DB connection.  DB-vs-repo sync enforced at deploy time
        # by railway.json preDeployCommand ("alembic upgrade head").
        # Rationale: railway run injects *.railway.internal which is unresolvable
        # from GitHub Actions runners (private network only).
        run: |
          set -euo pipefail
          echo "=== Schema Drift Gate (Staging — local-only) ==="
          cd salesos/backend
          poetry run python scripts/check_alembic_head.py --local-only

  deploy-backend-railway:
    name: Deploy Backend (Railway Staging)
    needs: schema-drift-gate
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_backend && needs.schema-drift-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Railway up (salesos backend → staging)
        # Deploy from repo root so the root railway.json / Dockerfile.railway path is used.
        # Prefer environment *name* `staging` for `railway up` — GHA runs on 2026-08-09 failed
        # with "Environment not found" when only the UUID secret was passed (CLI 5.x).
        # Secrets probe still requires RAILWAY_STAGING_ENVIRONMENT_ID present (inventory).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up --ci -y \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment staging \
            --service "${{ secrets.RAILWAY_STAGING_SERVICE_ID }}"

  health-check:
    name: Staging Health Gate
    needs: [staging-gate, schema-drift-gate, deploy-backend-railway]
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_backend && needs.deploy-backend-railway.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for stabilization
        run: sleep "${{ env.SMOKE_WAIT }}"
      - name: Probe staging /health
        env:
          HEALTH_URL_VAR: ${{ vars.RAILWAY_STAGING_HEALTH_URL }}
          HEALTH_URL_SECRET: ${{ secrets.RAILWAY_STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL_VAR:-${HEALTH_URL_SECRET:-}}"
          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::Set vars.RAILWAY_STAGING_HEALTH_URL (or secret) to staging public /health URL"
            exit 1
          fi
          case "${HEALTH_URL}" in
            */health) ENDPOINT="${HEALTH_URL}" ;;
            */) ENDPOINT="${HEALTH_URL}health" ;;
            *) ENDPOINT="${HEALTH_URL}/health" ;;
          esac
          echo "Probing: ${ENDPOINT}"
          for i in $(seq 1 "${{ env.SMOKE_RETRIES }}"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${ENDPOINT}" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging health check failed"
          exit 1

  frontend-vercel:
    name: Frontend (Vercel)
    needs: staging-gate
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_frontend_cli }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Primary path — Vercel Git integration
        run: |
          echo "DEC-149: FE staging/preview via Vercel Git (Root Directory salesos/frontend)."
          echo "Optional CLI when VERCEL_* secrets are set."
      - name: Optional Vercel CLI deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_* secrets incomplete — skip CLI (Git path remains primary)."
            exit 0
          fi
          npm install -g vercel@39
          # Approach B (VERCEL_DEPLOY.md): monorepo root + Root Directory salesos/frontend
          vercel deploy --yes --token "${VERCEL_TOKEN}"

  notify:
    name: Deploy Notification
    if: always()
    needs: [staging-gate, schema-drift-gate, deploy-backend-railway, health-check, frontend-vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          ready="${{ needs.staging-gate.outputs.staging_ready }}"
          if [ "$ready" = "false" ]; then
            echo "status=soft-skip" >> "$GITHUB_OUTPUT"
            echo "Staging deploy blocked (staging secrets absent)."
          elif [ "${{ needs.health-check.result }}" = "success" ] || [ "${{ needs.deploy-backend-railway.result }}" = "skipped" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'failure' && '#ff0000' || '#36a64f' }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SalesOS Staging Deploy (OPS-01 Row 4)* — `${{ needs.staging-gate.outputs.short_tag }}`\nStatus: *${{ steps.status.outputs.status }}*\nRef: `${{ github.ref_name }}`\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
