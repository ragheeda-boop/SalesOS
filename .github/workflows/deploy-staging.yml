name: Deploy Staging

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. abc1234). Leave empty for latest develop commit."
        required: false
        type: string
      skip_tests:
        description: "Skip pre-deploy tests (emergency only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ragheeda-boop/salesos
  STAGING_COMPOSE: salesos/infra/staging/docker-compose.staging.yml
  STAGING_ENV: .env.staging
  HEALTH_ENDPOINT: "http://localhost:8000/health"
  SMOKE_RETRIES: 6
  SMOKE_WAIT: 10

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Version Resolution
  # ──────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      short_tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG="${COMMIT_SHA}"
          fi
          SHORT=$(echo "$TAG" | cut -c1-7)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG (short: $SHORT)"

  # ──────────────────────────────────────────────
  # Build & Push Images
  # ──────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./salesos/backend
          file: ./salesos/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ needs.resolve-version.outputs.short_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

  build-frontend:
    name: Build & Push Frontend
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./salesos/frontend
          file: ./salesos/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ needs.resolve-version.outputs.short_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

  # ──────────────────────────────────────────────
  # Deploy to Staging VPS
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [resolve-version, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deploy_status: ${{ steps.deploy.outputs.status }}
      previous_tag: ${{ steps.deploy.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging VPS
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salesos-staging

            SHORT_TAG="${{ needs.resolve-version.outputs.short_tag }}"
            echo "=== Staging Deploy ==="
            echo "Image tag: $SHORT_TAG"

            CURRENT_IMG=$(docker compose -f ${{ env.STAGING_COMPOSE }} images backend 2>/dev/null | awk 'NR>1 {print $2}' | head -1 || echo "none")
            echo "Previous image: $CURRENT_IMG"
            echo "previous_tag=$CURRENT_IMG" >> $GITHUB_OUTPUT

            export IMAGE_TAG=$SHORT_TAG
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}

            docker compose -f ${{ env.STAGING_COMPOSE }} pull backend frontend

            echo "Running database migrations..."
            docker compose -f ${{ env.STAGING_COMPOSE }} up -d migrations
            docker compose -f ${{ env.STAGING_COMPOSE }} wait migrations

            echo "Starting services..."
            docker compose -f ${{ env.STAGING_COMPOSE }} up -d backend frontend

            echo "status=deployed" >> $GITHUB_OUTPUT
            echo "Staging deployment complete: $SHORT_TAG"

  # ──────────────────────────────────────────────
  # Health Check Gate
  # ──────────────────────────────────────────────
  health-check:
    name: Health Check Gate
    needs: [deploy-staging, resolve-version]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for stabilization
        run: sleep ${{ env.SMOKE_WAIT }}
      - name: Verify backend health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "Checking backend health..."
            for i in $(seq 1 ${{ env.SMOKE_RETRIES }}); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_ENDPOINT }} 2>/dev/null || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check PASSED"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Health check failed after ${{ env.SMOKE_RETRIES }} attempts"
            exit 1

  # ──────────────────────────────────────────────
  # Smoke Tests
  # ──────────────────────────────────────────────
  smoke-tests:
    name: Post-deploy Smoke Tests
    needs: [deploy-staging, health-check, resolve-version]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salesos-staging
            echo "=== Running Smoke Tests ==="

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_ENDPOINT }})
            if [ "$HEALTH" != "200" ]; then echo "FAIL: health -> $HEALTH"; exit 1; fi
            echo "PASS: /health"

            PING=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/ping")
            if [ "$PING" != "200" ]; then echo "FAIL: /ping -> $PING"; exit 1; fi
            echo "PASS: /ping"

            DETAILED=$(curl -s http://localhost:8000/health/detailed)
            DB_STATUS=$(echo "$DETAILED" | python3 -c "import sys,json; print(json.load(sys.stdin)['checks']['database']['status'])" 2>/dev/null || echo "unknown")
            if [ "$DB_STATUS" != "connected" ]; then echo "FAIL: database status=$DB_STATUS"; exit 1; fi
            echo "PASS: database connected"

            FE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
            if [ "$FE" != "200" ]; then echo "FAIL: frontend -> $FE"; exit 1; fi
            echo "PASS: frontend"

            ALL_HEALTHY=$(docker compose -f ${{ env.STAGING_COMPOSE }} ps --format "{{.Status}}" | grep -v "healthy" | wc -l)
            if [ "$ALL_HEALTHY" -gt 0 ]; then
              echo "WARN: $ALL_HEALTHY service(s) not healthy"
              docker compose -f ${{ env.STAGING_COMPOSE }} ps
            fi

            echo "All smoke tests passed"

  # ──────────────────────────────────────────────
  # Staging Rollback (on failure)
  # ──────────────────────────────────────────────
  rollback:
    name: Rollback Staging
    if: failure()
    needs: [deploy-staging, health-check, smoke-tests, resolve-version]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Rollback to previous tag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salesos-staging

            PREV_TAG="${{ needs.deploy-staging.outputs.previous_tag }}"
            echo "ROLLING BACK to: $PREV_TAG"

            export IMAGE_TAG=$PREV_TAG
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}

            docker compose -f ${{ env.STAGING_COMPOSE }} pull backend frontend
            docker compose -f ${{ env.STAGING_COMPOSE }} up -d backend frontend

            echo "Rollback complete — restored to $PREV_TAG"

      - name: Smoke tests after rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salesos-staging
            echo "=== Post-rollback smoke tests ==="
            for i in $(seq 1 6); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_ENDPOINT }} 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "PASS: Backend healthy after rollback"
                exit 0
              fi
              sleep 10
            done
            echo "FAIL: Backend not healthy after rollback"
            exit 1

      - name: Log rollback
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ needs.deploy-staging.outputs.previous_tag }}
        run: |
          echo "::warning::Rollback triggered for staging"
          echo "REF: ${REF_NAME}"
          echo "COMMIT: ${COMMIT_SHA}"
          echo "PREVIOUS_TAG: ${PREVIOUS_TAG}"

  # ──────────────────────────────────────────────
  # Notification
  # ──────────────────────────────────────────────
  notify:
    name: Deploy Notification
    if: always()
    needs: [deploy-staging, health-check, smoke-tests, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.status.outputs.status == 'success' && ':white_check_mark:' || ':x:' }} *SalesOS Staging Deploy* — `${{ needs.resolve-version.outputs.short_tag }}`\nStatus: *${{ steps.status.outputs.status }}*\nRef: `${{ github.ref_name }}`\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
