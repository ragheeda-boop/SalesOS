# Deploy Staging — DEC-149 (deferred until staging exists)
# Current operating state: ONE environment only (production Railway / live path).
# Staging Railway env + RAILWAY_STAGING_* secrets are OPTIONAL / DEFERRED.
# Do NOT auto-run on push (avoids dual-fire with deploy.yml on master).
# Manual dispatch only; soft-skips when staging IDs absent (does not fail default path).
# Frontend → Vercel (Git primary; optional CLI). No GHCR/SSH.
# CI Stage 6 GHCR publish (ci.yml) quarantined under DEC-150 Option B — not Phase 0 required.

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type CONFIRM-STAGING-DEPLOY (staging deferred until Railway staging exists — DEC-149 single-env)"
        required: true
        type: string
      skip_backend:
        description: "Skip Railway staging backend deploy"
        required: false
        type: boolean
        default: false
      skip_frontend_cli:
        description: "Skip optional Vercel CLI"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SMOKE_RETRIES: 12
  SMOKE_WAIT: 15

permissions:
  contents: read

jobs:
  staging-gate:
    name: Staging Availability Gate (DEC-149 single-env)
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      staging_ready: ${{ steps.probe.outputs.staging_ready }}
      short_tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require explicit confirmation
        env:
          ACK: ${{ inputs.confirm_staging }}
        run: |
          if [ "${ACK}" != "CONFIRM-STAGING-DEPLOY" ]; then
            echo "::error::Staging deploy is deferred (DEC-149 single-env — production only until staging exists)."
            echo "To run intentionally, set confirm_staging=CONFIRM-STAGING-DEPLOY."
            echo "Missing RAILWAY_STAGING_* is expected until a Railway staging environment is provisioned."
            exit 1
          fi
      - id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying: $SHORT"
      - name: Probe Railway staging secrets (soft skip if absent)
        id: probe
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          missing=""
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_STAGING_SERVICE_ID RAILWAY_STAGING_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::notice::DEC-149 single-env: staging Railway not provisioned — soft-skip deploy."
            echo "Absent secret names:${missing}"
            echo "Do not invent values. Re-enable after Railway staging env + RAILWAY_STAGING_* exist."
            echo "staging_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "staging_ready=true" >> "$GITHUB_OUTPUT"
          echo "Staging Railway secrets present — proceed with deploy."

  deploy-backend-railway:
    name: Deploy Backend (Railway Staging)
    needs: staging-gate
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_backend }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Railway up (salesos backend → staging)
        working-directory: salesos
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up --ci --detach \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment "${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}" \
            --service "${{ secrets.RAILWAY_STAGING_SERVICE_ID }}"

  health-check:
    name: Staging Health Gate
    needs: [staging-gate, deploy-backend-railway]
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_backend && needs.deploy-backend-railway.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for stabilization
        run: sleep "${{ env.SMOKE_WAIT }}"
      - name: Probe staging /health
        env:
          HEALTH_URL_VAR: ${{ vars.RAILWAY_STAGING_HEALTH_URL }}
          HEALTH_URL_SECRET: ${{ secrets.RAILWAY_STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL_VAR:-${HEALTH_URL_SECRET:-}}"
          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::Set vars.RAILWAY_STAGING_HEALTH_URL (or secret) to staging public /health URL"
            exit 1
          fi
          case "${HEALTH_URL}" in
            */health) ENDPOINT="${HEALTH_URL}" ;;
            */) ENDPOINT="${HEALTH_URL}health" ;;
            *) ENDPOINT="${HEALTH_URL}/health" ;;
          esac
          echo "Probing: ${ENDPOINT}"
          for i in $(seq 1 "${{ env.SMOKE_RETRIES }}"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${ENDPOINT}" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging health check failed"
          exit 1

  frontend-vercel:
    name: Frontend (Vercel)
    needs: staging-gate
    if: ${{ needs.staging-gate.outputs.staging_ready == 'true' && !inputs.skip_frontend_cli }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Primary path — Vercel Git integration
        run: |
          echo "DEC-149: FE staging/preview via Vercel Git (Root Directory salesos/frontend)."
          echo "Optional CLI when VERCEL_* secrets are set."
      - name: Optional Vercel CLI deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_* secrets incomplete — skip CLI (Git path remains primary)."
            exit 0
          fi
          npm install -g vercel@39
          # Approach B (VERCEL_DEPLOY.md): monorepo root + Root Directory salesos/frontend
          vercel deploy --yes --token "${VERCEL_TOKEN}"

  notify:
    name: Deploy Notification
    if: always()
    needs: [staging-gate, deploy-backend-railway, health-check, frontend-vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          ready="${{ needs.staging-gate.outputs.staging_ready }}"
          if [ "$ready" = "false" ]; then
            echo "status=soft-skip" >> "$GITHUB_OUTPUT"
            echo "DEC-149 single-env: staging soft-skipped (RAILWAY_STAGING_* absent)."
          elif [ "${{ needs.health-check.result }}" = "success" ] || [ "${{ needs.deploy-backend-railway.result }}" = "skipped" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'failure' && '#ff0000' || '#36a64f' }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SalesOS Staging Deploy (DEC-149 single-env)* — `${{ needs.staging-gate.outputs.short_tag }}`\nStatus: *${{ steps.status.outputs.status }}*\nRef: `${{ github.ref_name }}`\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
