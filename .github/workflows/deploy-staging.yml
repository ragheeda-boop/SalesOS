# Deploy Staging — DEC-149 canonical path
# Backend → Railway staging (`railway up`, DEC-120 Slice B pattern — no GHCR/SSH)
# Frontend → Vercel (Git on develop/master primary; optional CLI preview/prod-of-project)
# Supersedes STAGING_* SSH + GHCR image pull on VPS.
# CI Stage 6 GHCR publish (ci.yml) remains orthogonal (CI-08); this workflow does not push GHCR.

name: Deploy Staging

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      skip_backend:
        description: "Skip Railway staging backend deploy"
        required: false
        type: boolean
        default: false
      skip_frontend_cli:
        description: "Skip optional Vercel CLI"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SMOKE_RETRIES: 12
  SMOKE_WAIT: 15

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      short_tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Deploying: $SHORT"

  deploy-backend-railway:
    name: Deploy Backend (Railway Staging)
    needs: resolve-version
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Railway staging secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_STAGING_SERVICE_ID RAILWAY_STAGING_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: ${name} (DEC-149 staging — GitHub Environment 'staging')"
              missing=1
            fi
          done
          exit $missing
      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Railway up (salesos backend → staging)
        working-directory: salesos
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up --ci --detach \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment "${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}" \
            --service "${{ secrets.RAILWAY_STAGING_SERVICE_ID }}"

  health-check:
    name: Staging Health Gate
    needs: [resolve-version, deploy-backend-railway]
    if: ${{ !inputs.skip_backend && needs.deploy-backend-railway.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for stabilization
        run: sleep "${{ env.SMOKE_WAIT }}"
      - name: Probe staging /health
        env:
          HEALTH_URL_VAR: ${{ vars.RAILWAY_STAGING_HEALTH_URL }}
          HEALTH_URL_SECRET: ${{ secrets.RAILWAY_STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL_VAR:-${HEALTH_URL_SECRET:-}}"
          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::Set vars.RAILWAY_STAGING_HEALTH_URL (or secret) to staging public /health URL"
            exit 1
          fi
          case "${HEALTH_URL}" in
            */health) ENDPOINT="${HEALTH_URL}" ;;
            */) ENDPOINT="${HEALTH_URL}health" ;;
            *) ENDPOINT="${HEALTH_URL}/health" ;;
          esac
          echo "Probing: ${ENDPOINT}"
          for i in $(seq 1 "${{ env.SMOKE_RETRIES }}"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${ENDPOINT}" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging health check failed"
          exit 1

  frontend-vercel:
    name: Frontend (Vercel)
    needs: resolve-version
    if: ${{ !inputs.skip_frontend_cli }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Primary path — Vercel Git integration
        run: |
          echo "DEC-149: FE staging/preview via Vercel Git (Root Directory salesos/frontend)."
          echo "Optional CLI when VERCEL_* secrets are set."
      - name: Optional Vercel CLI deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_* secrets incomplete — skip CLI (Git path remains primary)."
            exit 0
          fi
          npm install -g vercel@39
          # Approach B (VERCEL_DEPLOY.md): monorepo root + Root Directory salesos/frontend
          vercel deploy --yes --token "${VERCEL_TOKEN}"

  notify:
    name: Deploy Notification
    if: always()
    needs: [resolve-version, deploy-backend-railway, health-check, frontend-vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.health-check.result }}" = "success" ] || [ "${{ needs.deploy-backend-railway.result }}" = "skipped" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SalesOS Staging Deploy (DEC-149 Railway+Vercel)* — `${{ needs.resolve-version.outputs.short_tag }}`\nStatus: *${{ steps.status.outputs.status }}*\nRef: `${{ github.ref_name }}`\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
