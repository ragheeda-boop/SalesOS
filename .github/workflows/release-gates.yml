name: Release Gates

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Gate Status
        run: |
          echo "## Release Gates (ADR-102 Hardening)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Security Scan | Pass (CI automated) |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Architecture Compliance | Pass (DEC-144) |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Performance | Manual review required |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. Testing | Pass (CI automated) |" >> $GITHUB_STEP_SUMMARY
          echo "| 5. CI/CD Pipeline | Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| 6. Infrastructure | Health checks required |" >> $GITHUB_STEP_SUMMARY
          echo "| 7. Documentation | Manual review required |" >> $GITHUB_STEP_SUMMARY
          echo "| 8. Final Decision | Awaiting gates 1-7 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [RELEASE_GATES.md](salesos/RELEASE_GATES.md) for full criteria." >> $GITHUB_STEP_SUMMARY
