# Stage 7 E2E — criterion 3.7 field path (DEC-150 B / DEC-151 freeze)
# Standalone so docs-only master pushes do not cancel E2E via ci.yml concurrency.
# Gate = Wave 13 smoke-auth-ui against real postgres/redis + host uvicorn.
name: Stage 7 E2E

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/e2e-stage7.yml"
      - ".github/workflows/ci.yml"
      - "salesos/frontend/e2e/**"
      - "salesos/frontend/playwright.config.ts"
      - "salesos/frontend/package-lock.json"
      - "salesos/backend/app/**"
      - "salesos/backend/poetry.lock"
      - "salesos/infra/docker/postgres/init/**"

concurrency:
  group: e2e-stage7-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  e2e:
    name: "Stage 7: E2E Tests"
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: ci-e2e-test-secret-key-do-not-use-in-prod!!
      JWT_SECRET_KEY: ci-e2e-test-jwt-secret-do-not-use-in-prod
      # Password meets identity complexity; quote to keep ! safe in YAML.
      E2E_USER_EMAIL: e2e.ci+stage7@example.com
      E2E_USER_PASSWORD: "E2eCiPassw0rd!"
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
      BASE_URL: http://localhost:3000
      SALESOS_JWKS_ALLOW_REGENERATE: "1"
      SALESOS_JWKS_KEY_DIR: /tmp/salesos-e2e-jwks
      EVENT_BUS_TYPE: in_memory
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: salesos
          POSTGRES_PASSWORD: salesos_test
          POSTGRES_DB: salesos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-e2e-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-e2e-${{ runner.os }}-
      - name: Install backend dependencies
        run: cd salesos/backend && poetry install --no-interaction
      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run migrations
        run: |
          cd salesos/backend
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          poetry run alembic upgrade head
      - name: Provision salesos_app role (R-14)
        run: |
          cd salesos
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/02-app-role.sql
          PGPASSWORD=salesos_test psql -h localhost -U salesos -d salesos_test \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE salesos_app WITH PASSWORD 'ci_app_role_test_password';"
      - name: Pre-warm JWKS RSA keys on disk
        # RSA-4096 sync gen on first token mint blocked the asyncio loop (~120s)
        # and Stage 7 register timed out (runs 30725710618 / 30725711300).
        run: |
          cd salesos/backend
          mkdir -p "${SALESOS_JWKS_KEY_DIR}"
          poetry run python -c "from app.modules.identity.jwks import get_private_key; get_private_key(); print('jwks prewarm ok')"
      - name: Start backend API
        run: |
          cd salesos/backend
          # Owner role for disposable register bootstrap. salesos_app + RLS
          # without tenant GUC hung register on tip 8600f68. RLS remains
          # covered by Stage 3/4 adversarial suites (DEC-085 untouched).
          # Startup also warms JWKS when SALESOS_JWKS_ALLOW_REGENERATE=1.
          DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          TEST_DATABASE_URL=postgresql+asyncpg://salesos:salesos_test@localhost:5432/salesos_test \
          POSTGRES_USER=salesos \
          POSTGRES_HOST=localhost \
          POSTGRES_PORT=5432 \
          POSTGRES_DB=salesos_test \
          POSTGRES_PASSWORD=salesos_test \
          REDIS_URL=redis://localhost:6379/0 \
          ALLOWED_HOSTS=http://localhost:3000,http://127.0.0.1:3000 \
          NEO4J_PASSWORD= \
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/salesos-e2e-backend.log 2>&1 &
          echo $! > /tmp/salesos-e2e-backend.pid
          for i in $(seq 1 120); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health/live >/dev/null 2>&1; then
              echo "backend live after ${i} attempts"
              curl -fsS --max-time 30 \
                http://127.0.0.1:8000/api/v1/identity/.well-known/jwks.json \
                >/tmp/e2e-jwks.json || true
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"
          tail -n 200 /tmp/salesos-e2e-backend.log || true
          exit 1
      - name: Register disposable E2E user
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "email": os.environ["E2E_USER_EMAIL"],
              "password": os.environ["E2E_USER_PASSWORD"],
              "full_name": "CI E2E User",
          }
          open("/tmp/e2e-register-body.json", "w", encoding="utf-8").write(json.dumps(payload))
          PY
          set +e
          code=$(curl -sS --max-time 90 -o /tmp/e2e-register.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8000/api/v1/identity/register \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/e2e-register-body.json)
          curl_rc=$?
          set -e
          echo "register HTTP ${code} curl_rc=${curl_rc}"
          cat /tmp/e2e-register.json || true
          if [ "$curl_rc" -ne 0 ]; then
            echo "::error::E2E user register curl failed (rc=${curl_rc})"
            tail -n 200 /tmp/salesos-e2e-backend.log || true
            exit 1
          fi
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::E2E user register failed (HTTP ${code})"
            tail -n 200 /tmp/salesos-e2e-backend.log || true
            exit 1
          fi
      - name: Install Playwright
        run: |
          cd salesos/frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Setup .env for E2E
        run: |
          printf '%s\n' 'NEXT_PUBLIC_API_URL=http://localhost:8000' 'API_URL=http://localhost:8000' \
            > salesos/frontend/.env.local
      - name: Run E2E tests (smoke + real BE)
        run: |
          cd salesos/frontend
          npx playwright test --config playwright.config.ts --project=chromium \
            e2e/smoke-auth-ui.spec.ts
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-backend-log
          path: /tmp/salesos-e2e-backend.log
          retention-days: 7
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: |
            salesos/frontend/test-results/
            salesos/frontend/playwright-report/
          retention-days: 7
