# Deploy Production — DEC-149 canonical path
# Backend → Railway (CLI `railway up`, DEC-120 alternate promote — no GHCR/SSH)
# Frontend → Vercel (Git integration primary per salesos/frontend/docs/VERCEL_DEPLOY.md;
#   optional CLI when VERCEL_* secrets are set)
# Single-env (2026-08-02): production Railway only — does NOT require RAILWAY_STAGING_*.
# Supersedes VPS blue/green (appleboy/ssh-action + VPS_*). Do not reintroduce VPS as default.
# CI Stage 6 GHCR publish (ci.yml) quarantined under DEC-150 Option B — not Phase 0 required.
# Quarantined alternate: deploy-production.yml (K8s) — not active.
# Staging: see deploy-staging.yml (deferred / dispatch-only until staging exists).

name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_backend:
        description: "Skip Railway backend deploy"
        required: false
        type: boolean
        default: false
      skip_frontend_cli:
        description: "Skip optional Vercel CLI (Git integration still applies on push)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HEALTH_WAIT: 30
  HEALTH_RETRIES: 12

permissions:
  contents: read
  id-token: write

jobs:
  pre-deploy-check:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify branch
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "${GIT_REF}" != "refs/heads/master" ]]; then
            echo "::error::Deploy only allowed from master branch (DEC-149 / CI-01)"
            exit 1
          fi
          echo "Branch check passed."
      - name: Resolve version
        id: version
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT="$(echo "${COMMIT_SHA}" | cut -c1-7)"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: ${SHORT}"

  schema-drift-gate:
    name: Schema Drift Gate (fail if alembic head != DB stamp)
    needs: pre-deploy-check
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('salesos/backend/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-
      - name: Install backend dependencies (needed to import alembic/app.config locally)
        run: cd salesos/backend && poetry install --no-interaction
      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Check alembic drift (DB current vs repo heads)
        # Reuses scripts/check_alembic_head.py (same gate ci.yml runs against the
        # ephemeral test DB) so drift logic isn't duplicated/diverged in bash regex.
        # `railway run` injects the target service's real env (DATABASE_URL,
        # SECRET_KEY, etc.) for this command only — nothing persists after it exits.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          echo "=== Schema Drift Gate ==="
          cd salesos/backend
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" -- \
            poetry run python scripts/check_alembic_head.py

  deploy-backend-railway:
    name: Deploy Backend (Railway)
    needs: schema-drift-gate
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Railway secrets (names only — values via GitHub Environments)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: ${name} (DEC-149 — provision in GitHub Environment 'production'; do not invent VPS_*)"
              missing=1
            fi
          done
          exit $missing
      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Railway up (salesos backend)
        # STORY-14-01 field: do NOT use --detach. Detach returns after upload and
        # Health Gate can false-green on a stale process still serving /health 200
        # (evidence: tip 06a8923 Deploy 30760184115 / 30763336159; uptime ~29h; /api/v1/load/meta 404).
        # --ci streams build and waits for deploy terminal status before exit.
        # Deploy from repo root so the root railway.json / Dockerfile.railway path is used.
        timeout-minutes: 25
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "DEC-149: railway up --ci (wait for roll; no --detach)"
          # railway up --ci can exit non-zero on build-log stream drop even when
          # the deployment itself reaches SUCCESS (field: tip 1ab17535 / 7bd1a67).
          # Poll the streamed deployment id when known, else newest only — never
          # "any SUCCESS in last N" (false-green risk). Poll window must cover a
          # full Docker build after stream drop (field: 7bd1a67 timed out at ~3m
          # while still BUILDING; da4f77f3 later SUCCESS Active).
          set +e
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          UP_OUT="$(railway up --ci -y \
            --build-arg "BUILD_COMMIT=${{ github.sha }}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "BUILD_ID=${{ github.run_id }}" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" 2>&1)"
          up_rc=$?
          set -e
          printf '%s\n' "$UP_OUT"
          if [ "$up_rc" -eq 0 ]; then
            echo "railway up --ci exited 0"
            exit 0
          fi
          echo "railway up --ci exited ${up_rc} — checking deployment status"
          TRACK_ID="$(printf '%s\n' "$UP_OUT" | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"[?&]id=([0-9a-fA-F-]{36})", t); print(m.group(1) if m else "")')"
          echo "track_deployment_id=${TRACK_ID:-<newest>}"
          export TRACK_ID
          python3 - <<'PY'
          import json, os, subprocess, sys, time

          project = "${{ secrets.RAILWAY_PROJECT_ID }}"
          environment = "${{ secrets.RAILWAY_ENVIRONMENT_ID }}"
          service = "${{ secrets.RAILWAY_SERVICE_ID }}"
          track_id = (os.environ.get("TRACK_ID") or "").strip()
          cmd = [
              "railway",
              "deployment",
              "list",
              "--project",
              project,
              "--environment",
              environment,
              "--service",
              service,
              "--limit",
              "5",
              "--json",
          ]

          def list_items():
              raw = subprocess.check_output(cmd, text=True)
              data = json.loads(raw)
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  items = data.get("deployments") or data.get("edges") or []
                  if items and isinstance(items[0], dict) and "node" in items[0]:
                      items = [e.get("node") or {} for e in items]
              else:
                  items = []
              return [i for i in items if isinstance(i, dict)]

          def poll_target():
              items = list_items()
              if not items:
                  return None, {}
              if track_id:
                  for item in items:
                      iid = str(item.get("id") or item.get("deploymentId") or "")
                      if iid == track_id:
                          status = (
                              item.get("status")
                              or item.get("state")
                              or item.get("deploymentStatus")
                              or ""
                          )
                          return str(status).upper(), item
                  # Tracked id not in last 5 yet — keep waiting (not terminal)
                  return "PENDING", {"id": track_id}
              item = items[0]
              status = (
                  item.get("status")
                  or item.get("state")
                  or item.get("deploymentStatus")
                  or ""
              )
              return str(status).upper(), item

          # ~20 min @ 5s — Docker builds often exceed the prior 3 min window.
          for i in range(240):
              status, item = poll_target()
              print(
                  f"deploy_poll={i} status={status!r} "
                  f"id={item.get('id') or item.get('deploymentId')} "
                  f"track={track_id or 'newest'}",
                  flush=True,
              )
              if status == "SUCCESS":
                  print(
                      "deployment SUCCESS after railway up non-zero — treating as ok",
                      flush=True,
                  )
                  sys.exit(0)
              if status in {"FAILED", "CRASHED", "REMOVED", "SKIPPED"}:
                  print(f"deployment terminal failure: {status}", flush=True)
                  sys.exit(1)
              # BUILDING / DEPLOYING / INITIALIZING / QUEUED / PENDING — keep waiting
              time.sleep(5)
          status, _ = poll_target()
          print(
              f"timed out waiting for deployment SUCCESS (last={status!r})",
              flush=True,
          )
          sys.exit(1)
          PY
      - name: Verify Railway active service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          echo "Verifying Railway status for service $RAILWAY_SERVICE_ID / environment $RAILWAY_ENVIRONMENT_ID"
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json > railway_status.json
          echo "Railway status JSON:"
          cat railway_status.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from pprint import pformat

          def collect_service_candidates(value):
              if isinstance(value, dict):
                  if value.get("serviceId"):
                      yield str(value["serviceId"])
                  if value.get("serviceName"):
                      yield str(value["serviceName"])
                  if isinstance(value.get("services"), dict):
                      for edge in value["services"].get("edges", []):
                          node = edge.get("node")
                          if isinstance(node, dict):
                              if node.get("id"):
                                  yield str(node["id"])
                              if node.get("name"):
                                  yield str(node["name"])
                  if isinstance(value.get("serviceInstances"), dict):
                      for edge in value["serviceInstances"].get("edges", []):
                          node = edge.get("node")
                          if isinstance(node, dict):
                              if node.get("serviceId"):
                                  yield str(node["serviceId"])
                              if node.get("serviceName"):
                                  yield str(node["serviceName"])
                  if value.get("service") is not None:
                      yield from collect_service_candidates(value["service"])
                  if value.get("activeService") is not None:
                      yield from collect_service_candidates(value["activeService"])
                  if value.get("serviceInfo") is not None:
                      yield from collect_service_candidates(value["serviceInfo"])
                  if value.get("node") is not None:
                      yield from collect_service_candidates(value["node"])
                  if value.get("edges") is not None:
                      yield from collect_service_candidates(value["edges"])
                  for child in value.values():
                      yield from collect_service_candidates(child)
              elif isinstance(value, list):
                  for item in value:
                      yield from collect_service_candidates(item)

          def find_expected_service(status, expected):
              candidates = []
              for candidate in collect_service_candidates(status):
                  if candidate and candidate not in candidates:
                      candidates.append(candidate)
              print(f"Railway status service candidates: {candidates}")
              if expected in candidates:
                  return expected
              return None

          status = json.loads(Path("railway_status.json").read_text())
          expected_service = os.environ["RAILWAY_SERVICE_ID"]
          actual_service = find_expected_service(status, expected_service)

          if actual_service is None:
              raise SystemExit(
                  "Railway status JSON did not include the expected service identifier. "
                  f"Expected: {expected_service}. Parsed candidates: {pformat(list(collect_service_candidates(status)))}"
              )

          print(f"Railway status service matches expected ID/name: {actual_service}")
          PY
      - name: Verify Railway deployment history includes success
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" --limit 5 --json > railway_deployments.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          deploys = json.loads(Path("railway_deployments.json").read_text())
          if not isinstance(deploys, list) or len(deploys) == 0:
              raise SystemExit("Railway deployment list returned no deployments")

          print("Railway deployment history summary:")
          for deploy in deploys:
              print(json.dumps({
                  "id": deploy.get("id"),
                  "status": deploy.get("status"),
                  "createdAt": deploy.get("createdAt"),
                  "sourceCommit": deploy.get("sourceCommit"),
              }, ensure_ascii=False))

          latest_successful = next((deploy for deploy in deploys if deploy.get("status") == "SUCCESS"), None)
          if latest_successful is None:
              latest_status = deploys[0].get("status")
              raise SystemExit(
                  f"No successful Railway deployments found in the last {len(deploys)} entries. "
                  f"Latest status: {latest_status}"
              )

          if deploys[0].get("status") == "SKIPPED":
              print("Latest deployment was SKIPPED; found an earlier successful deployment.")

          print(f"Latest successful Railway deployment {latest_successful.get('id')} status SUCCESS verified.")
          PY

  deploy-backend-health-gate:
    name: Backend Health Gate
    needs: deploy-backend-railway
    if: ${{ !inputs.skip_backend && needs.deploy-backend-railway.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for stabilization
        run: |
          echo "Waiting ${{ env.HEALTH_WAIT }}s..."
          sleep "${{ env.HEALTH_WAIT }}"
      - name: Probe public /health (require fresh process + tip route fingerprint)
        env:
          HEALTH_URL_VAR: ${{ vars.RAILWAY_HEALTH_URL }}
          HEALTH_URL_SECRET: ${{ secrets.RAILWAY_HEALTH_URL }}
          # Process older than this many seconds after a successful railway up --ci
          # is treated as a failed roll (stale instance still answering /health).
          MAX_UPTIME_SECONDS: "900"
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL_VAR:-${HEALTH_URL_SECRET:-}}"
          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::Set vars.RAILWAY_HEALTH_URL (or secret RAILWAY_HEALTH_URL) to the public backend /health URL"
            exit 1
          fi
          case "${HEALTH_URL}" in
            */health) ENDPOINT="${HEALTH_URL}" ;;
            */) ENDPOINT="${HEALTH_URL}health" ;;
            *) ENDPOINT="${HEALTH_URL}/health" ;;
          esac
          BASE="${ENDPOINT%/health}"
          echo "Probing: ${ENDPOINT}"
          for i in $(seq 1 "${{ env.HEALTH_RETRIES }}"); do
            BODY_FILE="$(mktemp)"
            STATUS=$(curl -sS -o "${BODY_FILE}" -w "%{http_code}" "${ENDPOINT}" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              UPTIME=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(float(d.get('uptime_seconds') or 1e12))" "${BODY_FILE}" 2>/dev/null || echo "1000000000000")
              echo "uptime_seconds=${UPTIME} (max allowed ${MAX_UPTIME_SECONDS})"
              # Tip ≥ 8a369f1 fingerprint: load router mounted (401/403 = present; 404 = stale/wrong service)
              LOAD_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${BASE}/api/v1/load/meta" 2>/dev/null || echo "000")
              echo "GET /api/v1/load/meta -> HTTP ${LOAD_CODE}"
              if awk -v u="$UPTIME" -v m="$MAX_UPTIME_SECONDS" 'BEGIN{exit !(u < m+0)}'; then
                if [ "${LOAD_CODE}" != "404" ] && [ "${LOAD_CODE}" != "000" ]; then
                  echo "Health gate PASSED (fresh process + load route present; HTTP ${LOAD_CODE} on /api/v1/load/meta)"
                  echo "NOTE: database readiness is Phase 2 — not claimed by this gate. No Production GO."
                  rm -f "${BODY_FILE}"
                  exit 0
                fi
                echo "Fresh uptime but /api/v1/load/meta still ${LOAD_CODE} — tip load_slo not on this service"
              else
                echo "Stale process still serving /health (uptime ${UPTIME}s) — railway roll did not replace runtime"
              fi
            fi
            rm -f "${BODY_FILE}"
            sleep 10
          done
          echo "::error::Health gate failed: need HTTP 200, uptime_seconds < ${MAX_UPTIME_SECONDS}, and /api/v1/load/meta != 404"
          exit 1

  parity-gate:
    name: FE/BE Parity Gate
    needs: deploy-backend-health-gate
    if: ${{ needs.deploy-backend-health-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe /api/v1/version and enforce parity (Exit 1 blocks deploy completion)
        env:
          HEALTH_URL_VAR: ${{ vars.RAILWAY_HEALTH_URL }}
          HEALTH_URL_SECRET: ${{ secrets.RAILWAY_HEALTH_URL }}
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_API_VERSION: ${{ vars.EXPECTED_API_VERSION }}
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL_VAR:-${HEALTH_URL_SECRET:-}}"
          if [ -z "${HEALTH_URL}" ]; then
            echo "::error::Set vars.RAILWAY_HEALTH_URL (or secret RAILWAY_HEALTH_URL) to run the parity gate"
            exit 1
          fi
          case "${HEALTH_URL}" in
            */) BASE="${HEALTH_URL%/}" ;;
            *) BASE="${HEALTH_URL}" ;;
          esac
          BASE="${BASE%/health}"
          VERSION_URL="${BASE}/api/v1/version"
          echo "Probing: ${VERSION_URL}"
          BODY_FILE="$(mktemp)"
          STATUS=$(curl -sS -o "${BODY_FILE}" -w "%{http_code}" "${VERSION_URL}" 2>/dev/null || echo "000")
          if [ "${STATUS}" != "200" ]; then
            echo "::error::GET /api/v1/version -> HTTP ${STATUS} (expected 200)"
            rm -f "${BODY_FILE}"
            exit 1
          fi
          BE_COMMIT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('backend_commit') or '')" "${BODY_FILE}")
          API_VERSION=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('api_version') or '')" "${BODY_FILE}")
          SCHEMA_VERSION=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('schema_version') or '')" "${BODY_FILE}")
          OPENAPI_HASH=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('openapi_hash') or '')" "${BODY_FILE}")
          echo "backend_commit=${BE_COMMIT}"
          echo "expected_commit=${GITHUB_SHA}"
          echo "api_version=${API_VERSION}"
          echo "schema_version=${SCHEMA_VERSION}"
          echo "openapi_hash=${OPENAPI_HASH}"

          FAIL=0
          if [ -z "${BE_COMMIT}" ]; then
            echo "::error::backend_commit is empty — build provenance not injected at deploy"
            FAIL=1
          elif [ "${BE_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "::error::Commit parity FAIL: backend ${BE_COMMIT} != repo ${GITHUB_SHA}"
            FAIL=1
          fi
          if [ "${API_VERSION}" != "${EXPECTED_API_VERSION:-5.1.0-rc1}" ]; then
            echo "::error::api_version mismatch: ${API_VERSION} != ${EXPECTED_API_VERSION:-5.1.0-rc1}"
            FAIL=1
          fi
          if [ -z "${SCHEMA_VERSION}" ] || [ "${SCHEMA_VERSION}" = "unavailable" ]; then
            echo "::error::schema_version unavailable — Alembic head not readable"
            FAIL=1
          fi
          if [ "${#OPENAPI_HASH}" -ne 64 ]; then
            echo "::error::openapi_hash invalid length ${#OPENAPI_HASH} (expected 64 hex)"
            FAIL=1
          fi

          if [ "${FAIL}" -eq 1 ]; then
            echo "::error::PARITY GATE FAILED — production deploy marked failed"
            rm -f "${BODY_FILE}"
            exit 1
          fi
          echo "PARITY GATE PASSED: backend_commit == ${GITHUB_SHA}, api_version == ${API_VERSION}, schema_version == ${SCHEMA_VERSION}, openapi_hash verified"
          rm -f "${BODY_FILE}"

  frontend-vercel:
    name: Frontend (Vercel)
    needs: pre-deploy-check
    if: ${{ !inputs.skip_frontend_cli }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Primary path — Vercel Git integration
        run: |
          echo "DEC-149 / VERCEL_DEPLOY.md: Production FE deploys via Vercel GitHub integration"
          echo "  Project: sales-os | Root Directory: salesos/frontend | Branch: master"
          echo "Push to master triggers Vercel independently of this job."
          echo "Optional CLI below runs only when VERCEL_TOKEN + org/project IDs are set."
      - name: Optional Vercel CLI production deploy
        id: vercel_cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not all set — skipping CLI (Git path remains primary)."
            echo "cli=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g vercel@39
          # Approach B (VERCEL_DEPLOY.md): monorepo root + project Root Directory = salesos/frontend
          # VERCEL_ORG_ID / VERCEL_PROJECT_ID are read from the environment by the CLI.
          NEXT_PUBLIC_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" vercel deploy --prod --yes --token "${VERCEL_TOKEN}"
          echo "cli=deployed" >> "$GITHUB_OUTPUT"

  notify:
    name: Deploy Notification
    if: always()
    needs: [pre-deploy-check, deploy-backend-railway, deploy-backend-health-gate, parity-gate, frontend-vercel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine status
        id: status
        run: |
          be="${{ needs.deploy-backend-railway.result }}"
          health="${{ needs.deploy-backend-health-gate.result }}"
          parity="${{ needs.parity-gate.result }}"
          fe="${{ needs.frontend-vercel.result }}"
          if [ "$be" = "success" ] && [ "$health" = "success" ] && [ "$parity" = "success" ] && { [ "$fe" = "success" ] || [ "$fe" = "skipped" ]; }; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "$be" = "skipped" ] && { [ "$fe" = "success" ] || [ "$fe" = "skipped" ]; }; then
            echo "status=partial" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SalesOS Production Deploy (DEC-149 Railway+Vercel)* — `${{ needs.pre-deploy-check.outputs.short_sha }}`\nStatus: *${{ steps.status.outputs.status }}*\nRef: `${{ github.ref_name }}`\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>"
                  }
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      - name: GitHub commit comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOY_STATUS: ${{ steps.status.outputs.status }}
          SHORT_SHA: ${{ needs.pre-deploy-check.outputs.short_sha }}
        with:
          script: |
            const status = process.env.DEPLOY_STATUS;
            const tag = process.env.SHORT_SHA;
            const emoji = status === 'success' ? '✅' : (status === 'partial' ? '⚠️' : '❌');
            const message = `${emoji} Production deploy **${status}** (DEC-149 Railway+Vercel) — \`${tag}\`\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });
