name: Security Scan

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check for forbidden files
        run: |
          forbidden=0
          for pattern in '*.env' '*.key' '*.pem' 'secrets.*' 'credentials*' '*.p12'; do
            files=$(git ls-files -- "$pattern" 2>/dev/null || true)
            if [ -n "$files" ]; then
              echo "::error::Forbidden pattern '$pattern' found: $files"
              forbidden=1
            fi
          done
          if git ls-files -- '**/prometheus-token' | grep -q .; then
            echo "::error::Committed prometheus-token detected — use prometheus-token.example only"
            forbidden=1
          fi
          if [ "$forbidden" = "1" ]; then exit 1; fi
          echo "No forbidden files detected."
      - name: Gitleaks (stub config at repo root)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy filesystem scan (secrets + vulns)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - name: Run Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesos/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        working-directory: .
        run: |
          pipx install poetry
          poetry self add poetry-plugin-export
      - name: Install pip-audit
        working-directory: .
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          # DEC-057 Option A + DEC-090 / DEC-128: named ignore for ecdsa Minerva (PYSEC-2026-1325) only.
          # Aligns security-scan with CI Stage 5 (ci.yml security-pip-audit). --strict retained.
          # Replaces stale placeholder PYSEC-2024-1 (did not audit poetry.lock).
          pip-audit -r /tmp/requirements.txt --desc on --ignore-vuln PYSEC-2026-1325 2>&1 | tee pip-audit-report.txt
          pip-audit -r /tmp/requirements.txt --desc on --ignore-vuln PYSEC-2026-1325 --strict
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: salesos/backend/pip-audit-report.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesos/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: salesos/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate 2>&1 | tee npm-audit-report.txt || true
      - name: Upload npm audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: salesos/frontend/npm-audit-report.txt

  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[sarif]"
      - name: Run bandit (Python SAST)
        run: |
          bandit -r salesos/backend/app/ \
            -f sarif -o salesos/backend/bandit-results.sarif \
            -ll -iii || true
      - name: Upload bandit results
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: salesos/backend/bandit-results.sarif
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (generic SAST)
        run: |
          semgrep --config=auto --sarif-output=semgrep-results.sarif --error --severity ERROR --severity WARNING || true
        continue-on-error: true
      - name: Upload semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: semgrep-results.sarif

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (backend)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./salesos/backend
          format: spdx-json
          output: sbom-backend.spdx.json
      - name: Generate SBOM (frontend)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./salesos/frontend
          format: spdx-json
          output: sbom-frontend.spdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json

  report:
    runs-on: ubuntu-latest
    needs: [secret-scan, pip-audit, npm-audit, sast-scan, sbom]
    if: always()
    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Summarize security findings
        run: |
          echo "## Security Scan Results" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret & Vulnerability (Trivy) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Config (IaC) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (backend) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit (frontend) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| bandit (Python SAST) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| semgrep (Generic SAST) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded for review." >> $GITHUB_STEP_SUMMARY
